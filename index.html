<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>הומפיוטר | תשלום</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;700;800&family=Heebo:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1729;
    --ink-soft:#5B677A;
    --blue:#2F5FFF;
    --blue-deep:#1E44D6;
    --mint:#00C2A8;
    --bg:#F4F7FC;
    --line:#E3E8F2;
    --card:#FFFFFF;
    --ok:#0E8F6F;
    --ok-bg:#E7F8F2;
    --err:#D8493B;
    --err-bg:#FDEEEC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    font-family:'Heebo', sans-serif;
    color:var(--ink);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .wrap{
    width:100%; max-width:460px; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(10px,2.5vh,22px) 16px;
    gap:clamp(6px,1.6vh,14px);
  }

  /* ---------- Logo ---------- */
  .logo-block{display:flex; flex-direction:column; align-items:center; gap:6px; flex:none;}
  .logo-block img{
    height:clamp(64px,13vh,96px); width:auto; max-width:80%;
    border-radius:12px; object-fit:contain;
    box-shadow:0 10px 26px -10px rgba(15,23,41,.3);
  }
  .lock-pill{
    display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ok);
    background:var(--ok-bg); padding:4px 11px; border-radius:999px; font-weight:600;
  }

  /* ---------- Card ---------- */
  .card{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 20px 44px -28px rgba(15,23,41,.28);
    flex:1 1 auto;
    min-height:480px;
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .section{padding:clamp(10px,1.8vh,16px) 18px; border-bottom:1px solid var(--line); flex:none;}
  .section:last-of-type{border-bottom:none;}

  /* ---------- Amount + installments row ---------- */
  .row2{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:10px;
    align-items:end; /* keep both controls sitting on the same baseline */
  }
  .field{display:flex; flex-direction:column; gap:5px; width:100%;}
  .field-label{font-size:11.5px; color:var(--ink-soft); font-weight:600; padding-inline-start:2px;}

  .field input{
    border:1.5px solid var(--line); border-radius:9px; padding:9px 11px;
    font-size:14px; font-family:'Heebo', sans-serif; outline:none; transition:.15s;
    color:var(--ink); background:#fff; width:100%;
  }
  .field input::placeholder{color:#9AA5B8;}
  .field input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,95,255,.1);}

  .amount-field{position:relative;}
  .amount-field input{
    font-family:'Fira Code', monospace;
    font-size:18px;
    font-weight:600;
    padding:0 40px 0 12px;
    height:44px;
    border-radius:9px;
  }
  .amount-field input::-webkit-outer-spin-button,
  .amount-field input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .amount-field input[type=number]{
    -moz-appearance:textfield; appearance:textfield;
  }
  .amount-field .currency{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:14px; font-family:'Fira Code', monospace;
  }

  select#tashlumim{
    border:1.5px solid var(--line); border-radius:9px; padding:0 10px;
    font-size:13.5px; font-family:'Heebo', sans-serif; color:var(--ink); background:#fff; outline:none;
    width:100%; height:44px;
  }
  select#tashlumim:focus{border-color:var(--blue);}

  /* ---------- More details toggle ---------- */
  .more-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px; padding:8px; border:none; background:none; cursor:pointer;
    font-size:13px; color:var(--blue); font-family:'Heebo', sans-serif; font-weight:600;
    width:100%;
  }
  .more-toggle svg{transition:transform .2s ease;}
  .more-toggle.open svg{transform:rotate(180deg);}

  .extra-fields{
    display:grid; grid-template-rows:0fr; transition:grid-template-rows .25s ease;
  }
  .extra-fields.open{grid-template-rows:1fr;}
  .extra-fields-inner{overflow:hidden;}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;}
  .order-line{margin-top:8px;}

  /* iframe */
  #NedarimFrame{width:100%; border:none; display:block; height:0; transition:height .25s ease;}

  .pay-btn{
    width:100%; padding:13px; border:none; border-radius:11px; cursor:pointer;
    background:linear-gradient(90deg, var(--blue), var(--blue-deep));
    color:#fff; font-size:15.5px; font-weight:700; font-family:'Rubik', sans-serif;
    box-shadow:0 12px 22px -12px rgba(47,95,255,.55);
    transition:transform .12s ease, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
    flex:none;
  }
  .pay-btn:hover{transform:translateY(-1px);}
  .pay-btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}

  .pay-section{padding:12px 18px; flex:none;}

  .status{
    margin-top:10px; padding:10px 13px; border-radius:9px; font-size:12.5px;
    display:none; align-items:flex-start; gap:8px; line-height:1.5;
  }
  .status.show{display:flex;}
  .status.ok{background:var(--ok-bg); color:var(--ok);}
  .status.err{background:var(--err-bg); color:var(--err);}

  .card::-webkit-scrollbar{width:5px;}
  .card::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>
<body>

<div class="wrap">
  <div class="logo-block">
    <img src="https://images.matara.pro/ClientsImages/7011337.jpg" alt="הומפיוטר">
    <div class="lock-pill">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#0E8F6F" stroke-width="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke="#0E8F6F" stroke-width="2"/></svg>
      תשלום מאובטח
    </div>
  </div>

  <div class="card">
    <div class="section">
      <div class="row2">
        <div class="field amount-field">
          <span class="field-label">סכום לתשלום</span>
          <input id="amount" type="number" min="5" placeholder="0">
          <span class="currency">₪</span>
        </div>
        <div class="field">
          <span class="field-label">תשלומים</span>
          <select id="tashlumim">
            <option value="1">תשלום אחד</option>
            <option value="2">2 תשלומים</option>
            <option value="3">3 תשלומים</option>
            <option value="6">6 תשלומים</option>
            <option value="12">12 תשלומים</option>
          </select>
        </div>
      </div>

      <button type="button" class="more-toggle" id="moreToggle">
        עוד פרטים
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="extra-fields" id="extraFields">
        <div class="extra-fields-inner">
          <div class="field order-line">
            <input id="orderDesc" type="text" placeholder="תיאור / מספר הזמנה (לא חובה)">
          </div>
          <div class="form-grid">
            <div class="field"><input id="firstName" type="text" placeholder="שם פרטי" autocomplete="given-name"></div>
            <div class="field"><input id="lastName" type="text" placeholder="שם משפחה" autocomplete="family-name"></div>
            <div class="field"><input id="phone" type="tel" placeholder="טלפון" autocomplete="tel"></div>
            <div class="field"><input id="mail" type="email" placeholder="דוא&quot;ל" autocomplete="email"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="section" style="flex:1 1 auto; min-height:0;">
      <iframe id="NedarimFrame" scrolling="no" title="טופס סליקת אשראי מאובטח"></iframe>
    </div>

    <div class="pay-section">
      <button class="pay-btn" id="payBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M2 10h20" stroke="#fff" stroke-width="1.8"/></svg>
        לתשלום
      </button>
      <div class="status" id="statusBox"></div>
    </div>
  </div>
</div>

<script>
/* ApiValid: טקסט אימות ייעודי לעסק - מיועד להישלח מהדפדפן, חשיפתו בקוד הצד-לקוח אינה מהווה סיכון */
const MOSAD_ID = '7011337';
const API_VALID = '2LR6bWRiJ+';

const frame = document.getElementById('NedarimFrame');
const payBtn = document.getElementById('payBtn');
const statusBox = document.getElementById('statusBox');
const moreToggle = document.getElementById('moreToggle');
const extraFields = document.getElementById('extraFields');

moreToggle.addEventListener('click', () => {
  const isOpen = extraFields.classList.toggle('open');
  moreToggle.classList.toggle('open', isOpen);
  moreToggle.firstChild.textContent = isOpen ? 'פחות פרטים ' : 'עוד פרטים ';
});


// רישום המאזין וטעינת ה-src פעם אחת בלבד בחיי הדף
window.addEventListener('message', ReadPostMessage);
frame.onload = function () { PostNedarim({ Name: 'GetHeight' }); };
frame.src = 'https://www.matara.pro/nedarimplus/iframe/';

function PostNedarim(Data) {
  frame.contentWindow.postMessage(Data, '*');
}

function ReadPostMessage(event) {
  switch (event.data && event.data.Name) {
    case 'Height':
      frame.style.height = (parseInt(event.data.Value, 10) + 15) + 'px';
      break;

    case 'TransactionResponse':
      handleTransactionResponse(event.data.Value);
      break;
  }
}

function handleTransactionResponse(result) {
  payBtn.disabled = false;
  statusBox.classList.remove('ok', 'err');
  statusBox.classList.add('show');

  if (result && result.Status === 'Error') {
    statusBox.classList.add('err');
    statusBox.textContent = 'שגיאה בביצוע התשלום: ' + (result.Message || 'נא לבדוק את פרטי הכרטיס ולנסות שוב.');
  } else {
    statusBox.classList.add('ok');
    let extra = '';
    if (result.Confirmation) extra += ' | אישור: ' + result.Confirmation;
    if (result.LastNum) extra += ' | כרטיס המסתיים ב-' + result.LastNum;
    statusBox.textContent = 'התשלום בוצע בהצלחה!' + extra;
  }
}

payBtn.addEventListener('click', () => {
  statusBox.classList.remove('show', 'ok', 'err');

  const amount = parseInt(document.getElementById('amount').value, 10);
  if (!amount || amount < 5) {
    statusBox.classList.add('show', 'err');
    statusBox.textContent = 'נא להזין סכום תקין (5 ₪ ומעלה).';
    return;
  }

  payBtn.disabled = true; // נעילת הכפתור עד לקבלת תשובה, למניעת חיוב כפול

  PostNedarim({
    Name: 'FinishTransaction2',
    Value: {
      Mosad: MOSAD_ID,
      ApiValid: API_VALID,
      PaymentType: 'Ragil',
      Currency: '1',

      Zeout: '',
      FirstName: document.getElementById('firstName').value,
      LastName: document.getElementById('lastName').value,
      Street: '',
      City: '',
      Phone: document.getElementById('phone').value,
      Mail: document.getElementById('mail').value,

      Amount: String(amount),
      Tashlumim: document.getElementById('tashlumim').value,
      Day: '',

      Groupe: '',
      Comment: document.getElementById('orderDesc').value,

      Param1: '',
      Param2: '',
      ForceUpdateMatching: '',
      ThirdPartyReceipt: '',

      CallBack: '',
      CallBackMailError: '',

      Tokef: ''
    }
  });
});
</script>
</body>
</html>
