<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הומפיוטר | תשלום מאובטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Heebo:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1729;
    --ink-soft:#5B677A;
    --blue:#2F5FFF;
    --blue-deep:#1E44D6;
    --mint:#00C2A8;
    --bg:#F4F7FC;
    --line:#E3E8F2;
    --card:#FFFFFF;
    --ok:#0E8F6F;
    --ok-bg:#E7F8F2;
    --err:#D8493B;
    --err-bg:#FDEEEC;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Heebo', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand img{
    height:40px; width:40px; border-radius:10px; object-fit:cover;
    box-shadow:0 4px 14px -4px rgba(15,23,41,.25);
  }
  .brand .name{font-family:'Rubik', sans-serif; font-weight:700; font-size:18px; color:var(--ink);}
  .brand .sub{font-size:11.5px; color:var(--ink-soft); font-family:'Fira Code', monospace; letter-spacing:.02em;}
  .lock-pill{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ok);
    background:var(--ok-bg); padding:7px 14px; border-radius:999px; font-weight:600;
  }

  .wrap{max-width:600px; margin:0 auto; padding:44px 20px 70px;}

  .hero{text-align:center; margin-bottom:8px;}
  .hero .eyebrow{
    font-family:'Fira Code', monospace; font-size:12px; letter-spacing:.16em;
    color:var(--blue); text-transform:uppercase; margin-bottom:10px; font-weight:500;
  }
  .hero h1{
    font-family:'Rubik', sans-serif; font-weight:700; font-size:clamp(26px,5vw,32px);
    margin:0 0 8px; color:var(--ink);
  }
  .hero p{margin:0; color:var(--ink-soft); font-size:14.5px;}

  /* ---------- Signature: scanning trace ---------- */
  .scan{
    position:relative; height:34px; margin:26px 0 6px; overflow:hidden;
    display:flex; align-items:center;
  }
  .scan::before{
    content:""; position:absolute; inset:0; margin:auto 0; height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
  }
  .scan-dot{
    position:absolute; top:50%; width:9px; height:9px; border-radius:50%;
    background:var(--blue); box-shadow:0 0 0 5px rgba(47,95,255,.13);
    transform:translateY(-50%);
    animation:scanmove 3.2s ease-in-out infinite;
  }
  @keyframes scanmove{
    0%{left:0%;}
    50%{left:100%; background:var(--mint); box-shadow:0 0 0 5px rgba(0,194,168,.15);}
    100%{left:0%;}
  }
  @media (prefers-reduced-motion: reduce){ .scan-dot{animation:none; left:0;} }

  /* ---------- Card ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 24px 50px -30px rgba(15,23,41,.25);
    overflow:hidden;
  }
  .section{padding:26px 30px; border-bottom:1px solid var(--line);}
  .section:last-of-type{border-bottom:none;}
  .section-label{
    display:flex; align-items:center; gap:10px;
    font-size:12px; letter-spacing:.1em; color:var(--ink-soft);
    font-weight:700; margin-bottom:16px; text-transform:uppercase;
  }
  .section-label .dot{width:7px; height:7px; border-radius:50%; background:var(--blue);}

  /* order summary */
  .order-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .order-row:last-child{margin-bottom:0;}
  .field{display:flex; flex-direction:column; gap:6px; width:100%;}
  .field label{font-size:12.5px; color:var(--ink-soft); font-weight:600;}
  .field input{
    border:1.5px solid var(--line); border-radius:10px; padding:12px 13px;
    font-size:15px; font-family:'Heebo', sans-serif; outline:none; transition:.15s;
    color:var(--ink); background:#fff; width:100%;
  }
  .field input:focus{border-color:var(--blue); box-shadow:0 0 0 4px rgba(47,95,255,.1);}

  .amount-field{position:relative;}
  .amount-field input{
    font-family:'Fira Code', monospace; font-size:24px; font-weight:500; padding:14px 44px 14px 13px;
    color:var(--ink);
  }
  .amount-field .currency{
    position:absolute; left:16px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:18px; font-family:'Fira Code', monospace;
  }

  .installments{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .installments label{font-size:13px; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  select#tashlumim{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px;
    font-size:14.5px; font-family:'Heebo', sans-serif; color:var(--ink); background:#fff; outline:none;
  }
  select#tashlumim:focus{border-color:var(--blue);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field.full{grid-column:1/-1;}

  /* iframe */
  .iframe-shell{
    border:1.5px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg);
    padding:2px;
  }
  #NedarimFrame{width:100%; border:none; display:block; height:0; transition:height .25s ease; background:#fff;}

  .pay-btn{
    width:100%; padding:16px; border:none; border-radius:12px; cursor:pointer;
    background:linear-gradient(90deg, var(--blue), var(--blue-deep));
    color:#fff; font-size:16.5px; font-weight:700; font-family:'Rubik', sans-serif;
    box-shadow:0 14px 26px -12px rgba(47,95,255,.55);
    transition:transform .12s ease, box-shadow .12s ease, opacity .2s;
    margin-top:20px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .pay-btn:hover{transform:translateY(-1px);}
  .pay-btn:disabled{opacity:.55; cursor:not-allowed; transform:none;}

  .status{
    margin-top:14px; padding:14px 16px; border-radius:10px; font-size:14px;
    display:none; align-items:flex-start; gap:10px; line-height:1.6;
  }
  .status.show{display:flex;}
  .status.ok{background:var(--ok-bg); color:var(--ok);}
  .status.err{background:var(--err-bg); color:var(--err);}

  .secure-note{
    display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color:var(--ink-soft);
  }

  .foot{
    text-align:center; margin-top:24px; font-size:12px; color:var(--ink-soft);
  }
  .foot b{color:var(--ink);}

  @media (max-width:520px){
    .form-grid{grid-template-columns:1fr;}
    .section{padding:22px 20px;}
    .topbar{padding:14px 16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="https://images.matara.pro/ClientsImages/7011337.jpg" alt="לוגו הומפיוטר">
    <div>
      <div class="name">הומפיוטר</div>
      <div class="sub">מס' עסק 7011337</div>
    </div>
  </div>
  <div class="lock-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#0E8F6F" stroke-width="2"/><path d="M8 11V7a4 4 0 018 0v4" stroke="#0E8F6F" stroke-width="2"/></svg>
    תשלום מאובטח
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">CHECKOUT</div>
    <h1>השלמת תשלום</h1>
    <p>מלאו את פרטי ההזמנה והתשלום — הסליקה מתבצעת בחיבור מוצפן.</p>
  </div>

  <div class="scan"><div class="scan-dot"></div></div>

  <div class="card">
    <!-- Order -->
    <div class="section">
      <div class="section-label"><span class="dot"></span>פרטי ההזמנה</div>
      <div class="order-row">
        <div class="field">
          <label for="orderDesc">תיאור / מספר הזמנה</label>
          <input id="orderDesc" type="text" placeholder="לדוגמה: תיקון מחשב נייד #1042">
        </div>
      </div>
      <div class="order-row">
        <div class="field amount-field">
          <label for="amount">סכום לתשלום</label>
          <input id="amount" type="number" min="5" placeholder="0" value="">
          <span class="currency">₪</span>
        </div>
      </div>
      <div class="installments">
        <label for="tashlumim">פריסת תשלומים</label>
        <select id="tashlumim">
          <option value="1">תשלום אחד</option>
          <option value="2">2 תשלומים</option>
          <option value="3">3 תשלומים</option>
          <option value="6">6 תשלומים</option>
          <option value="12">12 תשלומים</option>
        </select>
      </div>
    </div>

    <!-- Customer -->
    <div class="section">
      <div class="section-label"><span class="dot"></span>פרטי הלקוח</div>
      <div class="form-grid">
        <div class="field"><label for="firstName">שם פרטי</label><input id="firstName" type="text" autocomplete="given-name"></div>
        <div class="field"><label for="lastName">שם משפחה</label><input id="lastName" type="text" autocomplete="family-name"></div>
        <div class="field"><label for="phone">טלפון</label><input id="phone" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="mail">דוא"ל</label><input id="mail" type="email" autocomplete="email"></div>
      </div>
    </div>

    <!-- Payment -->
    <div class="section">
      <div class="section-label"><span class="dot"></span>פרטי כרטיס אשראי</div>
      <div class="iframe-shell">
        <iframe id="NedarimFrame" scrolling="no" title="טופס סליקת אשראי מאובטח"></iframe>
      </div>
      <div class="secure-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3.5v5.2c0 5-3.2 8.6-7 10.3-3.8-1.7-7-5.3-7-10.3V5.5L12 2z" stroke="#5B677A" stroke-width="1.4"/></svg>
        חיבור מוצפן מול מערכת הסליקה של נדרים פלוס — פרטי הכרטיס אינם עוברים דרך שרת העסק.
      </div>

      <button class="pay-btn" id="payBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="20" height="14" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M2 10h20" stroke="#fff" stroke-width="1.8"/></svg>
        לתשלום
      </button>
      <div class="status" id="statusBox"></div>
    </div>
  </div>

  <div class="foot">התשלום מתבצע עבור <b>הומפיוטר</b> באמצעות נדרים פלוס</div>
</div>

<script>
/* ====== הגדרות עסק ======
   ApiValid הוא "טקסט אימות" ייעודי לעסק (ולא סיסמה סודית) - מיועד להישלח מהדפדפן לאייפרם,
   ולכן חשיפתו בקוד הצד-לקוח אינה מהווה סיכון, לפי תיעוד נדרים פלוס.
*/
const MOSAD_ID = '7011337';
const API_VALID = '2LR6bWRiJ+';

const frame = document.getElementById('NedarimFrame');
const payBtn = document.getElementById('payBtn');
const statusBox = document.getElementById('statusBox');

// רישום המאזין וטעינת ה-src פעם אחת בלבד בחיי הדף
window.addEventListener('message', ReadPostMessage);
frame.onload = function () { PostNedarim({ Name: 'GetHeight' }); };
frame.src = 'https://www.matara.pro/nedarimplus/iframe/';

function PostNedarim(Data) {
  frame.contentWindow.postMessage(Data, '*');
}

function ReadPostMessage(event) {
  switch (event.data && event.data.Name) {
    case 'Height':
      frame.style.height = (parseInt(event.data.Value, 10) + 15) + 'px';
      break;

    case 'TransactionResponse':
      handleTransactionResponse(event.data.Value);
      break;
  }
}

function handleTransactionResponse(result) {
  payBtn.disabled = false;
  statusBox.classList.remove('ok', 'err');
  statusBox.classList.add('show');

  if (result && result.Status === 'Error') {
    statusBox.classList.add('err');
    statusBox.textContent = 'אירעה שגיאה בביצוע התשלום: ' + (result.Message || 'נא לבדוק את פרטי הכרטיס ולנסות שוב.');
  } else {
    statusBox.classList.add('ok');
    let extra = '';
    if (result.Confirmation) extra += ' | מספר אישור: ' + result.Confirmation;
    if (result.LastNum) extra += ' | כרטיס המסתיים ב-' + result.LastNum;
    statusBox.textContent = 'התשלום בוצע בהצלחה, תודה!' + extra;
  }
}

payBtn.addEventListener('click', () => {
  statusBox.classList.remove('show', 'ok', 'err');

  const amount = parseInt(document.getElementById('amount').value, 10);
  if (!amount || amount < 5) {
    statusBox.classList.add('show', 'err');
    statusBox.textContent = 'נא להזין סכום תקין (5 ₪ ומעלה).';
    return;
  }

  payBtn.disabled = true; // נעילת הכפתור עד לקבלת תשובה, למניעת חיוב כפול

  PostNedarim({
    Name: 'FinishTransaction2',
    Value: {
      Mosad: MOSAD_ID,
      ApiValid: API_VALID,
      PaymentType: 'Ragil',
      Currency: '1',

      Zeout: '',
      FirstName: document.getElementById('firstName').value,
      LastName: document.getElementById('lastName').value,
      Street: '',
      City: '',
      Phone: document.getElementById('phone').value,
      Mail: document.getElementById('mail').value,

      Amount: String(amount),
      Tashlumim: document.getElementById('tashlumim').value,
      Day: '',

      Groupe: '',
      Comment: document.getElementById('orderDesc').value,

      Param1: '',
      Param2: '',
      ForceUpdateMatching: '',
      ThirdPartyReceipt: '',

      CallBack: '',
      CallBackMailError: '',

      Tokef: ''
    }
  });
});
</script>
</body>
</html>
